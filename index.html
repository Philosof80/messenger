<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#17212b">
<title>Messenger by F1nPlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
:root{
  --bg:#0e1621; --surface:#17212b; --surface-2:#242f3d;
  --ink:#f5f5f5; --muted:#7f91a4; --line:#101921;
  --accent:#2b5278; --telegram-blue:#2481cc; --accent-ink:#ffffff;
  --ok:#4faf82; --warn:#c8912f; --danger:#e53935;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",monospace;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#f0f2f5; --surface:#ffffff; --surface-2:#f4f5f7;
    --ink:#1c242c; --muted:#707f8d; --line:#e3e7eb;
    --accent:#3390ec; --telegram-blue:#2481cc; --accent-ink:#ffffff;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}

#app{height:100vh;display:flex;overflow:hidden;position:relative}

/* 1. Регистрация и Вход */
#auth-screen{position:fixed;inset:0;background:var(--bg);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px 28px;text-align:center;box-shadow:0 12px 36px rgba(0,0,0,0.25)}
.auth-logo{font-size:48px;margin-bottom:12px}
.auth-title{font-size:22px;font-weight:600;margin:0 0 6px}
.auth-sub{font-size:13.5px;color:var(--muted);margin:0 0 20px}
.form-group{text-align:left;margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--muted);margin-bottom:6px;letter-spacing:0.04em}
.input-text{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);font-size:15px}
.input-text:focus{border-color:var(--telegram-blue);outline:none}
.btn-primary{width:100%;padding:12px;border:none;border-radius:12px;background:var(--telegram-blue);color:#fff;font-weight:600;font-size:15px;cursor:pointer;margin-top:10px;transition:opacity .2s}
.btn-primary:hover{opacity:.9}
.btn-link{background:none;border:none;color:var(--telegram-blue);font-size:13px;cursor:pointer;margin-top:14px;padding:6px;display:inline-block}
.btn-link:hover{text-decoration:underline}

.id-badge-box{background:var(--surface-2);border:1px dashed var(--telegram-blue);border-radius:14px;padding:12px;margin-bottom:16px;text-align:center}
.id-badge-number{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--telegram-blue);letter-spacing:0.12em;margin:4px 0}
.avatar-picker{width:86px;height:86px;border-radius:50%;margin:0 auto 16px;background:var(--surface-2);border:2px dashed var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.avatar-picker img{width:100%;height:100%;object-fit:cover}

/* 2. Сайдбар */
#sidebar{width:360px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:relative}
@media (max-width:768px){
  #sidebar{width:100%;position:absolute;inset:0;z-index:20;transition:transform .25s ease}
  #sidebar.hide-mobile{transform:translateX(-100%)}
}
.sidebar-header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.sidebar-header h2{margin:0;font-size:18px;font-weight:600}
.sidebar-content{flex:1;overflow-y:auto;position:relative}

.chat-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .15s}
.chat-item:hover{background:var(--surface-2)}
.chat-avatar{width:48px;height:48px;border-radius:50%;background:var(--surface-2);flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;overflow:hidden;color:var(--telegram-blue)}
.chat-avatar img{width:100%;height:100%;object-fit:cover}
.chat-meta{flex:1;min-width:0}
.chat-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.chat-name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:11px;color:var(--muted);font-family:var(--mono)}
.chat-preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#fab-new-chat{
  position:absolute;right:18px;bottom:72px;width:54px;height:54px;border-radius:50%;
  background:var(--telegram-blue);color:#ffffff;border:none;box-shadow:0 4px 16px rgba(36,129,204,0.45);
  display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;z-index:30;transition:transform .2s;
}
#fab-new-chat:hover{transform:scale(1.06)}

#bottom-tabs{height:58px;border-top:1px solid var(--line);display:flex;background:var(--surface);flex:none}
.tab-btn{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:500}
.tab-btn span.tab-icon{font-size:19px;line-height:1}
.tab-btn.active{color:var(--telegram-blue)}

/* 3. Основная правая панель */
#main-view{flex:1;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
#empty-placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:24px}
#empty-placeholder .bubble{background:var(--surface);padding:14px 22px;border-radius:24px;border:1px solid var(--line);font-size:14.5px}

#contact-safety-banner{
  background:var(--surface-2);border-bottom:1px solid var(--line);padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
}
.safety-title{font-size:13px;color:var(--muted)}
.safety-btns{display:flex;gap:8px}
.btn-sm{padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer;border:none}
.btn-sm-add{background:var(--telegram-blue);color:#fff}
.btn-sm-block{background:var(--danger);color:#fff}

#active-chat-container{flex:1;display:flex;flex-direction:column;height:100%}
#chat-header{height:60px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:12px;flex:none}
#btn-back{display:none;background:none;border:none;font-size:20px;cursor:pointer;padding:6px;color:var(--muted)}
@media (max-width:768px){#btn-back{display:block}}
.peer-details{flex:1;min-width:0}
.peer-details b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peer-details span{font-size:12px;color:var(--ok)}
.header-actions{display:flex;gap:6px}
.icon-btn{background:none;border:none;padding:8px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--surface-2);color:var(--telegram-blue)}

#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}

.msg{
  max-width:min(85%, 340px);
  padding:8px 12px;
  border-radius:16px;
  background:var(--surface);
  border:1px solid var(--line);
  align-self:flex-start;
  overflow-wrap:anywhere;
  box-sizing:border-box;
}
.msg.mine{
  align-self:flex-end;
  background:var(--accent);
  color:var(--accent-ink);
  border-color:transparent;
}
.msg .meta{
  font-family:var(--mono);
  font-size:10px;
  opacity:.7;
  margin-top:4px;
  text-align:right;
}
.msg-img{max-width:260px;max-height:260px;border-radius:10px;object-fit:cover;cursor:pointer;margin-bottom:4px}
.circle-video{width:220px;height:220px;border-radius:50%;object-fit:cover;overflow:hidden;border:3px solid var(--telegram-blue);cursor:pointer}
.sticker-img{font-size:52px;line-height:1;user-select:none;display:inline-block}

.audio-msg{display:block;width:260px;max-width:100%}
.audio-msg audio{display:block;width:100%;height:44px;outline:none}

#composer{
  display:flex;
  align-items:flex-end;
  gap:6px;
  padding:8px 10px;
  background:var(--surface);
  border-top:1px solid var(--line);
  box-sizing:border-box;
  width:100%;
}
.composer-btn{
  background:none;
  border:none;
  padding:8px 6px;
  cursor:pointer;
  font-size:20px;
  color:var(--muted);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  line-height:1;
}

#draft{
  flex:1 1 auto;
  min-width:0;
  max-height:120px;
  min-height:38px;
  height:38px;
  padding:8px 14px;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--surface-2);
  font-size:15px;
  line-height:1.35;
  resize:none;
  box-sizing:border-box;
  color:var(--ink);
}
#draft:focus{outline:none;border-color:var(--telegram-blue)}

#btn-send{
  width:38px;
  height:38px;
  border-radius:50%;
  background:var(--telegram-blue);
  color:#fff;
  border:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  flex-shrink:0;
  margin-bottom:1px;
}
#btn-send:disabled{opacity:.4;cursor:default}

/* 4. Настройки */
#settings-view{padding:24px 20px;overflow-y:auto;flex:1}
.settings-wrap{max-width:480px;margin:0 auto}
.settings-avatar-box{text-align:center;margin-bottom:24px}
.settings-avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;background:var(--surface-2);border:2px solid var(--telegram-blue);overflow:hidden;cursor:pointer}
.settings-avatar img{width:100%;height:100%;object-fit:cover}
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.card-title{font-size:13px;font-weight:600;text-transform:uppercase;color:var(--muted);letter-spacing:.04em;margin-bottom:12px}

#stickers-popover{position:absolute;bottom:68px;left:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,0.2);display:grid;grid-template-columns:repeat(5,42px);gap:8px;font-size:26px;z-index:100}
#stickers-popover span{cursor:pointer;text-align:center;transition:transform .15s}
#stickers-popover span:hover{transform:scale(1.25)}

/* Модальные окна */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1500;padding:16px}
.modal-body{background:var(--surface);border-radius:18px;padding:24px;width:100%;max-width:400px;text-align:center}

#qr-reader{width:100%;border-radius:14px;overflow:hidden;background:#000;margin-top:10px}
#circle-recorder{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:1600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
#circle-preview{width:260px;height:260px;border-radius:50%;object-fit:cover;border:4px solid #fff}
.rec-timer{color:#fff;font-family:var(--mono);font-size:18px;font-weight:600}

#call-overlay{position:fixed;inset:0;background:#0c1117;z-index:1700;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#call-videos{position:relative;width:100%;max-width:760px;height:65vh;background:#000;border-radius:16px;overflow:hidden;margin-bottom:20
